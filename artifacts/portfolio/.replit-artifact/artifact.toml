kind = "web"
previewPath = "/"
title = "Bhanu Sri Ginjupalli Portfolio"
description = "A personal portfolio website for Bhanu Sri Ginjupalli, a CS & AI undergraduate at Amrita Vishwa Vidyapeetham. Features a dark terminal-themed design showcasing her skills in AI/ML, DevOps, and SWE, along with her projects, roles, certifications, and leadership experience."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
